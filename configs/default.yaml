paper:
  slug: implicit-mutual-learning-with-dual-branch-networks-for-face-super-resolution
  title: "Implicit Mutual Learning With Dual-Branch Networks for Face Super-Resolution"
data:
  dataset: celeba
  root: ../../datasets/celeba/extracted/celeba
  max_train_samples: 256
  max_val_samples: 32
  max_test_samples: 32
model:
  name: imlfsr
  scale: 8
  n_feats: 48
  n_dfrm: 2
  hr_size: 128
  lr_size: 16
train:
  protocol: subset
  epochs: 2
  batch_size: 8
  lr: 0.0001
  w_rec: 1.0
  w_st: 1.0
  w_edge: 0.1
  seed: 42
  num_workers: 2
  log_every: 20
  max_steps: null
eval:
  batch_size: 8
paths:
  checkpoint_dir: outputs/checkpoints/default
  log_dir: outputs/logs
  pred_dir: outputs/predictions/default
  figure_dir: outputs/figures
report:
  title: IML-FaceSR Default Report
device: cuda
cuda_device: 0
