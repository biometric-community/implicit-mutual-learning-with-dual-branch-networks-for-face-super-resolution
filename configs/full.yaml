paper:
  slug: implicit-mutual-learning-with-dual-branch-networks-for-face-super-resolution
  title: "Implicit Mutual Learning With Dual-Branch Networks for Face Super-Resolution"
data:
  dataset: celeba
  root: ../../datasets/celeba/extracted/celeba
  helen_root: ../../datasets/helen
  # Paper Sec. IV-A: 2000 train / 60 test on CelebA
  max_train_samples: 2000
  max_val_samples: 60
  max_test_samples: 60
  cache_struct: true
model:
  name: imlfsr
  scale: 8
  n_feats: 48
  n_dfrm: 2
  hr_size: 128
  lr_size: 16
train:
  protocol: full
  epochs: 100
  batch_size: 8
  lr: 0.0001
  w_rec: 1.0
  w_st: 1.0
  w_edge: 0.1
  seed: 42
  num_workers: 4
  log_every: 50
  max_steps: null
eval:
  batch_size: 8
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures
report:
  title: IML-FaceSR Results Report (full)
device: cuda
cuda_device: 0
