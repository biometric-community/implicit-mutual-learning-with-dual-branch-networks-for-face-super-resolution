paper:
  slug: implicit-mutual-learning-with-dual-branch-networks-for-face-super-resolution
  title: "Implicit Mutual Learning With Dual-Branch Networks for Face Super-Resolution"
data:
  dataset: celeba
  root: ../../datasets/celeba/extracted/celeba
  helen_root: ../../datasets/helen
  max_train_samples: 64
  max_val_samples: 16
  max_test_samples: 16
  cache_struct: false
model:
  name: imlfsr
  scale: 8
  n_feats: 48
  n_dfrm: 2
  hr_size: 128
  lr_size: 16
train:
  protocol: smoke
  epochs: 1
  batch_size: 4
  lr: 0.0001
  w_rec: 1.0
  w_st: 1.0
  w_edge: 0.1
  seed: 42
  num_workers: 2
  log_every: 10
  max_steps: 20
eval:
  batch_size: 4
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures
report:
  title: IML-FaceSR Smoke Report
device: cuda
cuda_device: 0
